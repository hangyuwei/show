<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微信热门文章平台</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #02030a; }
body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f8fafc; }
.frame { position: relative; width: 1280px; height: 720px; overflow: hidden; background: radial-gradient(circle at 18% 12%, #38bdf822, transparent 28%), radial-gradient(circle at 86% 16%, #a7f3d016, transparent 30%), linear-gradient(135deg, #02030a 0%, #06121d 54%, #03040a 100%); }
.frame::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px); background-size: 44px 44px; mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.18)); }
.orbit { position: absolute; right: -110px; top: -130px; width: 410px; height: 410px; border-radius: 999px; border: 1px solid rgba(255,255,255,.09); }
.orbit.two { right: -48px; top: -68px; width: 286px; height: 286px; border-color: #38bdf822; }
.shell { position: absolute; inset: 42px; border: 1px solid rgba(255,255,255,.08); border-radius: 22px; background: rgba(3, 8, 16, .72); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 28px 80px rgba(0,0,0,.34); overflow: hidden; }
.topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.075); background: rgba(255,255,255,.025); }
.dots { display: flex; gap: 8px; } .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); } .dot:first-child { background: #38bdf8; box-shadow: 0 0 18px #38bdf8; }
.mode { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: .22em; color: rgba(226,232,240,.56); }
.status { display: flex; align-items: center; gap: 8px; color: rgba(226,232,240,.66); font-size: 13px; } .status i { display:block; width:8px; height:8px; border-radius:50%; background:#38bdf8; box-shadow:0 0 18px #38bdf8; }
.content { display: grid; grid-template-columns: 430px 1fr; gap: 22px; padding: 24px; }
.left, .right, .wide { border: 1px solid rgba(255,255,255,.075); background: rgba(255,255,255,.032); border-radius: 16px; }
.left { height: 544px; padding: 24px; position: relative; overflow: hidden; }
.left::after { content: ""; position: absolute; inset: auto 24px 0; height: 1px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); opacity: .55; }
.kicker { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 999px; border: 1px solid #38bdf844; color: #38bdf8; background: #38bdf812; font-size: 12px; font-weight: 700; }
.kicker i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
h1 { margin: 22px 0 0; font-size: 34px; line-height: 1.18; letter-spacing: -0.02em; max-width: 360px; }
.tagline { margin-top: 14px; color: rgba(203,213,225,.72); font-size: 16px; line-height: 1.65; }
.summary { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.07); color: rgba(226,232,240,.78); font-size: 15px; line-height: 1.75; }
.chips { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04); border-radius: 999px; padding: 6px 10px; color: rgba(226,232,240,.74); font-size: 12px; }
.right { height: 544px; padding: 18px; display: grid; grid-template-rows: 170px 1fr; gap: 14px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.metric { border: 1px solid rgba(255,255,255,.07); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018)); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
.metric::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:linear-gradient(90deg, #38bdf8, transparent); opacity:.65; }
.metric b { display:block; font-size: 28px; line-height: 1; margin-top: 22px; } .metric span { color: rgba(203,213,225,.62); font-size: 12px; }
.panel { border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 16px; background: rgba(0,0,0,.16); }
.panel-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:.18em; color:rgba(226,232,240,.55); }
.rows { display:grid; gap: 11px; }
.row { display:grid; grid-template-columns: 116px 1fr 42px; gap: 12px; align-items:center; color:rgba(226,232,240,.72); font-size: 13px; }
.track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow:hidden; } .bar { height:100%; border-radius:999px; background: linear-gradient(90deg, #38bdf8, #a7f3d0); box-shadow: 0 0 18px #38bdf866; }
.signals { margin-top: 16px; display:grid; gap:10px; }
.signal { display:flex; gap:10px; align-items:flex-start; padding: 11px 12px; border:1px solid rgba(255,255,255,.065); border-radius:12px; color:rgba(226,232,240,.76); font-size:13px; line-height:1.45; background:rgba(255,255,255,.026); } .signal i { margin-top:5px; width:6px; height:6px; border-radius:50%; background:#38bdf8; box-shadow:0 0 12px #38bdf8; flex:0 0 auto; }
.footer { position:absolute; left:66px; right:66px; bottom:58px; display:flex; justify-content:space-between; color:rgba(148,163,184,.52); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .18em; }
</style>
</head>
<body>
<div class="frame">
  <div class="orbit"></div><div class="orbit two"></div>
  <section class="shell">
    <div class="topbar"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="mode">OPERATIONS DASHBOARD</div><div class="status"><i></i>2023 · 已完成</div></div>
    <div class="content">
      <aside class="left">
        <div class="kicker"><i></i>Web开发</div>
        <h1>微信热门文章平台</h1>
        <p class="tagline">聚合微信热门文章的内容发现与推荐平台</p>
        <p class="summary">完成了微信文章聚合与分类浏览原型，能够把分散文章整理为可搜索、可筛选的内容列表。</p>
        <div class="chips"><span class="chip">Web</span></div>
      </aside>
      <main class="right">
        <div class="metrics"><div class="metric"><span>访问路径</span><b>92%</b></div><div class="metric"><span>内容节点</span><b>18</b></div><div class="metric"><span>交互转化</span><b>3.6x</b></div></div>
        <div class="panel">
          <div class="panel-title"><span>DELIVERY EVIDENCE</span><span>WEHOT</span></div>
          <div class="rows"><div class="row"><span>WEB</span><div class="track"><div class="bar" style="width:88%"></div></div><span>88</span></div></div>
          <div class="signals"><div class="signal"><i></i><span>完成了微信文章聚合与分类浏览原型</span></div><div class="signal"><i></i><span>能够把分散文章整理为可搜索、可筛选的内容列表</span></div></div>
        </div>
      </main>
    </div>
  </section>
  <div class="footer"><span>PROJECT DELIVERY SCREENSHOT</span><span>Web Dev / WeHot - WeChat Trending Articles</span></div>
</div>
</body>
</html>
