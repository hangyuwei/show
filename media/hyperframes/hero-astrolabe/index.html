<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02030a;
        font-family: sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 44%, rgba(21, 58, 92, 0.48), transparent 34%),
          radial-gradient(circle at 20% 12%, rgba(101, 216, 255, 0.15), transparent 24%),
          radial-gradient(circle at 80% 78%, rgba(242, 193, 102, 0.11), transparent 23%),
          #02030a;
      }

      #scene-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .grade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          radial-gradient(circle at 50% 48%, transparent 0%, rgba(2, 3, 10, 0.03) 36%, rgba(2, 3, 10, 0.48) 86%, rgba(2, 3, 10, 0.88) 100%),
          linear-gradient(180deg, rgba(2, 3, 10, 0.12), transparent 44%, rgba(2, 3, 10, 0.34));
        pointer-events: none;
      }

      .scanline {
        position: absolute;
        inset: 0;
        z-index: 3;
        opacity: 0.08;
        background-image: linear-gradient(
          180deg,
          transparent 0,
          transparent 6px,
          rgba(232, 242, 255, 0.24) 7px,
          transparent 8px
        );
        background-size: 100% 10px;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .hud {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .corner {
        position: absolute;
        width: 260px;
        height: 150px;
        border-color: rgba(101, 216, 255, 0.28);
      }

      .corner::before,
      .corner::after {
        content: "";
        position: absolute;
        background: rgba(242, 193, 102, 0.58);
        box-shadow: 0 0 18px rgba(242, 193, 102, 0.24);
      }

      .corner::before {
        width: 74px;
        height: 1px;
      }

      .corner::after {
        width: 1px;
        height: 54px;
      }

      .corner-a {
        left: 70px;
        top: 58px;
        border-left: 1px solid rgba(101, 216, 255, 0.22);
        border-top: 1px solid rgba(101, 216, 255, 0.22);
      }

      .corner-a::before,
      .corner-a::after {
        left: 0;
        top: 0;
      }

      .corner-b {
        right: 70px;
        bottom: 58px;
        border-right: 1px solid rgba(101, 216, 255, 0.22);
        border-bottom: 1px solid rgba(101, 216, 255, 0.22);
      }

      .corner-b::before {
        right: 0;
        bottom: 0;
      }

      .corner-b::after {
        right: 0;
        bottom: 0;
      }

      .label {
        position: absolute;
        color: rgba(232, 242, 255, 0.42);
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(101, 216, 255, 0.2);
      }

      .label-left {
        left: 92px;
        bottom: 96px;
      }

      .label-right {
        right: 92px;
        top: 88px;
        text-align: right;
      }

      .aperture {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        width: 720px;
        height: 720px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid rgba(232, 242, 255, 0.08);
        box-shadow:
          inset 0 0 90px rgba(2, 3, 10, 0.72),
          0 0 120px rgba(101, 216, 255, 0.04);
        opacity: 0.64;
        pointer-events: none;
      }

      .aperture::before {
        content: "";
        position: absolute;
        inset: 84px;
        border-radius: 50%;
        border: 1px dashed rgba(242, 193, 102, 0.18);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-astrolabe"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="scene-canvas" width="1920" height="1080"></canvas>
      <div class="grade"></div>
      <div class="scanline"></div>
      <div class="hud">
        <div class="corner corner-a"></div>
        <div class="corner corner-b"></div>
        <div class="label label-left">Atlas Vector / Calibrated</div>
        <div class="label label-right">Multi Camera Pass / GSAP</div>
        <div class="aperture"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      function mulberry32(seed) {
        return function seededRandom() {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(314159);
      const canvas = document.getElementById("scene-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x02030a, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x02030a, 0.015);

      const cameraRig = new THREE.Group();
      const camera = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 180);
      camera.position.set(0, 4.8, 16);
      cameraRig.add(camera);
      scene.add(cameraRig);

      const keyLight = new THREE.PointLight(0x65d8ff, 52, 70);
      keyLight.position.set(-9, 8, 10);
      scene.add(keyLight);

      const goldLight = new THREE.PointLight(0xf2c166, 26, 42);
      goldLight.position.set(8, -3, 12);
      scene.add(goldLight);

      scene.add(new THREE.AmbientLight(0x1c3552, 2.2));

      const astrolabe = new THREE.Group();
      astrolabe.rotation.x = THREE.MathUtils.degToRad(64);
      scene.add(astrolabe);

      const starGeometry = new THREE.BufferGeometry();
      const starCount = 1400;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i += 1) {
        const radius = 38 + rand() * 80;
        const theta = rand() * Math.PI * 2;
        const phi = Math.acos(rand() * 2 - 1);
        const index = i * 3;
        starPositions[index] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[index + 1] = radius * Math.cos(phi) * 0.68;
        starPositions[index + 2] = radius * Math.sin(phi) * Math.sin(theta);

        const warmth = rand();
        starColors[index] = 0.45 + warmth * 0.55;
        starColors[index + 1] = 0.58 + warmth * 0.32;
        starColors[index + 2] = 0.78 + warmth * 0.22;
      }
      starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      starGeometry.setAttribute("color", new THREE.BufferAttribute(starColors, 3));
      const stars = new THREE.Points(
        starGeometry,
        new THREE.PointsMaterial({
          size: 0.07,
          vertexColors: true,
          transparent: true,
          opacity: 0.92,
          depthWrite: false,
        }),
      );
      scene.add(stars);

      function makeRing(radius, color, opacity, tube = 0.012) {
        const mesh = new THREE.Mesh(
          new THREE.TorusGeometry(radius, tube, 8, 240),
          new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        mesh.userData.baseOpacity = opacity;
        astrolabe.add(mesh);
        return mesh;
      }

      const rings = [
        makeRing(2.35, 0x65d8ff, 0.42),
        makeRing(3.15, 0xe8f2ff, 0.28, 0.009),
        makeRing(4.05, 0xf2c166, 0.35, 0.01),
        makeRing(4.75, 0x65d8ff, 0.26, 0.008),
        makeRing(5.65, 0xe8f2ff, 0.18, 0.007),
        makeRing(6.28, 0xf2c166, 0.3, 0.008),
      ];

      const tickGroup = new THREE.Group();
      astrolabe.add(tickGroup);
      const tickMaterial = new THREE.MeshBasicMaterial({
        color: 0xe8f2ff,
        transparent: true,
        opacity: 0.44,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const goldTickMaterial = new THREE.MeshBasicMaterial({
        color: 0xf2c166,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      for (let i = 0; i < 144; i += 1) {
        const major = i % 12 === 0;
        const mid = i % 6 === 0;
        const angle = (i / 144) * Math.PI * 2;
        const radius = major ? 6.3 : 5.78;
        const length = major ? 0.58 : mid ? 0.36 : 0.18;
        const tick = new THREE.Mesh(
          new THREE.BoxGeometry(0.018, length, 0.018),
          major ? goldTickMaterial : tickMaterial,
        );
        tick.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
        tick.rotation.z = angle - Math.PI / 2;
        tickGroup.add(tick);
      }

      const nodeGroup = new THREE.Group();
      astrolabe.add(nodeGroup);
      const nodeMaterials = [
        new THREE.MeshBasicMaterial({ color: 0x65d8ff, transparent: true, opacity: 0.76 }),
        new THREE.MeshBasicMaterial({ color: 0xf2c166, transparent: true, opacity: 0.78 }),
        new THREE.MeshBasicMaterial({ color: 0xff4d6d, transparent: true, opacity: 0.7 }),
      ];
      const nodePositions = [
        [2.1, 0.8, 0],
        [-2.8, 1.2, 0],
        [1.4, -2.9, 0],
        [-4.4, -0.7, 0],
        [4.6, 1.6, 0],
        [0.1, 4.1, 0],
        [3.5, -3.7, 0],
      ];
      nodePositions.forEach((position, index) => {
        const node = new THREE.Mesh(
          new THREE.SphereGeometry(index === 2 ? 0.075 : 0.06, 18, 12),
          nodeMaterials[index % nodeMaterials.length],
        );
        node.position.set(position[0], position[1], position[2]);
        nodeGroup.add(node);
      });

      const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x65d8ff,
        transparent: true,
        opacity: 0.34,
        blending: THREE.AdditiveBlending,
      });
      const constellationPoints = nodePositions.map(
        (point) => new THREE.Vector3(point[0], point[1], point[2]),
      );
      const constellation = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(constellationPoints),
        lineMaterial,
      );
      astrolabe.add(constellation);

      const sweep = new THREE.Mesh(
        new THREE.RingGeometry(0.9, 6.05, 192, 1, 0, Math.PI * 0.18),
        new THREE.MeshBasicMaterial({
          color: 0x65d8ff,
          transparent: true,
          opacity: 0.22,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }),
      );
      astrolabe.add(sweep);

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 32, 16),
        new THREE.MeshBasicMaterial({
          color: 0xe8f2ff,
          transparent: true,
          opacity: 0.86,
          blending: THREE.AdditiveBlending,
        }),
      );
      astrolabe.add(core);

      const renderState = {
        time: 0,
        ringScale: 0.58,
        ringOpacity: 0.42,
        cameraX: -2.0,
        cameraY: 5.2,
        cameraZ: 15.5,
        rigZ: -7.2,
        rigRotZ: -0.28,
        rigRotY: 0.18,
        astrolabeRotZ: -0.95,
        sweepRot: -0.9,
        starRot: 0,
        nodePulse: 0.8,
      };

      function renderFrame() {
        rings.forEach((ring, index) => {
          ring.scale.setScalar(renderState.ringScale + index * 0.018);
          ring.material.opacity = renderState.ringOpacity * ring.userData.baseOpacity;
        });
        tickGroup.scale.setScalar(renderState.ringScale);
        tickGroup.children.forEach((tick) => {
          tick.material.opacity = renderState.ringOpacity * (tick.material === goldTickMaterial ? 0.92 : 0.66);
        });
        nodeGroup.scale.setScalar(renderState.ringScale);
        nodeGroup.children.forEach((node, index) => {
          const pulse = 1 + Math.sin(renderState.nodePulse + index * 1.7) * 0.22;
          node.scale.setScalar(pulse);
          node.material.opacity = renderState.ringOpacity * (index === 2 ? 0.92 : 0.82);
        });
        constellation.scale.setScalar(renderState.ringScale);
        constellation.material.opacity = renderState.ringOpacity * 0.36;
        sweep.scale.setScalar(renderState.ringScale);
        sweep.rotation.z = renderState.sweepRot;
        sweep.material.opacity = renderState.ringOpacity * 0.24;
        core.scale.setScalar(renderState.ringScale);
        core.material.opacity = renderState.ringOpacity * 0.92;

        stars.rotation.y = renderState.starRot;
        astrolabe.rotation.z = renderState.astrolabeRotZ;
        camera.position.set(renderState.cameraX, renderState.cameraY, renderState.cameraZ);
        cameraRig.position.z = renderState.rigZ;
        cameraRig.rotation.z = renderState.rigRotZ;
        cameraRig.rotation.y = renderState.rigRotY;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power2.inOut" },
        onUpdate: renderFrame,
      });

      tl.to(renderState, {
        duration: 2.7,
        cameraX: -1.2,
        cameraY: 4.2,
        cameraZ: 11.4,
        rigZ: -5.5,
        rigRotZ: -0.16,
        rigRotY: 0.1,
        ringScale: 0.62,
        ringOpacity: 0.68,
        astrolabeRotZ: -0.42,
        starRot: 0.06,
        sweepRot: 0.1,
        nodePulse: 1.4,
      }, 0);

      tl.to(renderState, {
        duration: 3.2,
        cameraX: 2.1,
        cameraY: 2.0,
        cameraZ: 8.1,
        rigZ: -1.2,
        rigRotZ: 0.08,
        rigRotY: -0.12,
        ringScale: 0.92,
        ringOpacity: 0.94,
        astrolabeRotZ: 0.64,
        starRot: 0.16,
        sweepRot: 2.5,
        nodePulse: 4.8,
      }, 2.6);

      tl.to(renderState, {
        duration: 3,
        cameraX: -0.9,
        cameraY: 6.5,
        cameraZ: 9.8,
        rigZ: 0,
        rigRotZ: 0.03,
        rigRotY: 0.03,
        ringScale: 1.05,
        ringOpacity: 1,
        astrolabeRotZ: 1.38,
        starRot: 0.24,
        sweepRot: 5.2,
        nodePulse: 8.2,
      }, 5.7);

      tl.to(renderState, {
        duration: 3.3,
        cameraX: 0,
        cameraY: 7.8,
        cameraZ: 12.5,
        rigZ: 1.2,
        rigRotZ: 0,
        rigRotY: 0,
        ringScale: 1,
        ringOpacity: 0.78,
        astrolabeRotZ: 1.82,
        starRot: 0.31,
        sweepRot: 6.4,
        nodePulse: 10,
        ease: "sine.inOut",
      }, 8.7);

      tl.fromTo(".corner-a", { opacity: 0, x: -26, y: -18 }, { opacity: 1, x: 0, y: 0, duration: 1.4 }, 0.35);
      tl.fromTo(".corner-b", { opacity: 0, x: 26, y: 18 }, { opacity: 1, x: 0, y: 0, duration: 1.4 }, 0.55);
      tl.fromTo(".label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.1, stagger: 0.2 }, 1.1);
      tl.fromTo(".aperture", { opacity: 0, scale: 0.84 }, { opacity: 0.52, scale: 1, duration: 2.4 }, 4.8);
      tl.to(".scanline", { opacity: 0.05, duration: 3.2, ease: "sine.inOut" }, 8.8);

      window.__timelines["hero-astrolabe"] = tl;
      renderFrame();
    </script>
  </body>
</html>
